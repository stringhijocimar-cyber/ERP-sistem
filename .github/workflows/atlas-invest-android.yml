name: Atlas Invest • Android and validation
on:
  pull_request:
    paths:
      - 'apps/atlas-invest/**'
      - '.github/workflows/atlas-invest-android.yml'
  push:
    branches: ['main']
    paths:
      - 'apps/atlas-invest/**'
      - '.github/workflows/atlas-invest-android.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/atlas-invest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Financial invariants and provider contracts
        run: npm test
      - name: Install browser for UI checks
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Mobile UI, navigation, persistence, charts and screenshots
        run: npm run test:ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble and lint Android
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Prepare installable APK
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/Atlas-Invest-0.1.0.apk
          sha256sum deliverables/Atlas-Invest-0.1.0.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Invest-0.1.0-Android
          path: apps/atlas-invest/deliverables/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-Invest-visual-validation
          path: |
            apps/atlas-invest/qa/*
            apps/atlas-invest/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 90
