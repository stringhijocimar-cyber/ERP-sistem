# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — publica o backend Node do Horus ERP (API + UI juntos).
#
# SEGURANÇA / PERSISTÊNCIA:
# - Em produção, SEED_PASSWORD precisa ser forte e diferente da senha padrão.
# - Para dados reais, configure DB_PATH apontando para um disco persistente.
# - Banco efêmero só é permitido quando ALLOW_EPHEMERAL_DB=1 for definido
#   explicitamente para uma demonstração descartável.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: horus-erp
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_PASSWORD      # defina no painel (senha FORTE, mínimo 12 caracteres)
        sync: false
      # Plano free = disco efêmero (o banco reseta a cada deploy). O guard de
      # produção exige este opt-in explícito para aceitar rodar sem persistência
      # — é uma DEMO. Basta clicar em "Inserir dados de simulação" para repovoar.
      - key: ALLOW_EPHEMERAL_DB
        value: "1"
      #
      # PARA DADOS REAIS (clientes): troque para um plano com disco, comente o
      # ALLOW_EPHEMERAL_DB acima, descomente o DB_PATH e o bloco `disk` abaixo.
      # - key: DB_PATH
      #   value: /data/nexus.db
    # disk:
    #   name: horus-data
    #   mountPath: /data
    #   sizeGB: 1
