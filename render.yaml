# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — publica o backend Node do Horus ERP (API + UI juntos).
#
# SEGURANÇA / PERSISTÊNCIA:
# - Em produção, SEED_PASSWORD precisa ser forte e diferente da senha padrão.
# - Para dados reais, configure DB_PATH apontando para um disco persistente.
# - Banco efêmero só é permitido quando ALLOW_EPHEMERAL_DB=1 for definido
#   explicitamente para uma demonstração descartável.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: horus-erp
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_PASSWORD      # defina no painel (senha FORTE, mínimo 12 caracteres)
        sync: false
      # Opt-in de banco EFÊMERO. Declarado aqui, mas SEM valor: o Blueprint não
      # concede a autorização sozinho — alguém precisa definir explicitamente
      # ALLOW_EPHEMERAL_DB=1 no painel do Render para um ambiente de DEMO.
      # Deixando em branco, o guard falha fechado (produção sem DB_PATH e sem
      # opt-in = start bloqueado), que é o comportamento desejado.
      - key: ALLOW_EPHEMERAL_DB
        sync: false
      #
      # PARA DADOS REAIS (clientes): use um plano com disco, NÃO defina
      # ALLOW_EPHEMERAL_DB e descomente o DB_PATH e o bloco `disk` abaixo.
      # - key: DB_PATH
      #   value: /data/nexus.db
    # disk:
    #   name: horus-data
    #   mountPath: /data
    #   sizeGB: 1
